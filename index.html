<h1>aircon</h1>
<p>aircon is a personal command-line tool that turns the owner's own Google Nest thermostat's air conditioning on and off using the Google Smart Device Management API.</p>
<p><code>aircon on</code> · <code>aircon off</code> · <code>aircon status</code></p>
<p>It is a private, single-user tool and is not offered to the public.</p>
